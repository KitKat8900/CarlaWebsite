<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>GIRL EDM</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="home.css" />
</head>

<body>
<div class="stage">

	<!-- photo / gif -->
	<img class="hero" src="gifs/girl%20edm.gif" alt="">

	<!-- big title -->
	<img class="title" src="web%20assets/girl%20edm%20title.svg" alt="GIRL EDM">

	<!-- ascii art -->
	<img class="ascii" src="ascii-art%20(3).png" alt="">

	<!-- 3D links: the model path goes in data-model -->
	<a class="obj-link" id="link-scale" href="scale.html" aria-label="music scale">
		<canvas data-model="web assets/OBJ/Asset 1.obj"></canvas>
	</a>
	<!-- change href="#" to blog.html once that page exists -->
	<a class="obj-link" id="link-blog" href="#" aria-label="blog and interviews">
		<canvas data-model="web assets/OBJ/Asset 2.obj"></canvas>
	</a>
	<!-- change href="#" to timeline.html once that page exists -->
	<a class="obj-link" id="link-timeline" href="#" aria-label="timeline">
		<canvas data-model="web assets/OBJ/Asset 3.obj"></canvas>
	</a>

	<!-- now listening -->
	<p class="listen-label">NOW LISTENING TO:</p>
	<p class="listen-song">bodyfeeling (title of song)</p>
	<p class="listen-artist">&#8627; underscores (artist)</p>

	<!-- credits -->
	<p class="credit">Website design by Carla Mu&ntilde;oz<br>Coded by Lucas Jaramillo</p>

</div>

<script type="importmap">
{ "imports": {
	"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
	"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MAX_TURN = 0.5;       // how far each object turns toward the mouse (radians)
const EASE = 0.08;          // lower = lazier, higher = snappier
const OBJ_COLOR = 0x111111; // color of the .obj objects (they have no color of their own)

const mouse = { x: 0, y: 0 };
window.addEventListener('pointermove', (e) => {
	mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
	mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
});

const objLoader = new OBJLoader();
const gltfLoader = new GLTFLoader();

// loads .obj or .gltf/.glb depending on the file name
function loadModel(url, done) {
	if (/\.(gltf|glb)$/i.test(url)) {
		gltfLoader.load(url, (g) => done(g.scene));
	} else {
		objLoader.load(url, (obj) => {
			obj.traverse((c) => {
				if (c.isMesh) {
					c.material = new THREE.MeshStandardMaterial({
						color: OBJ_COLOR,
						roughness: 0.5,
						metalness: 0.2,
						side: THREE.DoubleSide
					});
				}
			});
			done(obj);
		});
	}
}

// one small 3D scene per canvas
function setupObject(canvas) {
	const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
	renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

	const scene = new THREE.Scene();
	const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 1000);
	scene.add(new THREE.AmbientLight(0xffffff, 1.2));
	const light = new THREE.DirectionalLight(0xffffff, 2);
	light.position.set(2, 3, 5);
	scene.add(light);

	const pivot = new THREE.Group(); // this is what turns toward the mouse
	scene.add(pivot);

	let size = null;

	// size the canvas and back the camera up until the whole object fits
	function fit() {
		const w = canvas.clientWidth, h = canvas.clientHeight;
		if (!w || !h) return;
		renderer.setSize(w, h, false);
		camera.aspect = w / h;
		camera.updateProjectionMatrix();
		if (size) {
			const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
			const dist = Math.max(size.y / 2 / t, size.x / 2 / (t * camera.aspect));
			camera.position.set(0, 0, dist * 1.25 + size.z / 2);
		}
	}

	loadModel(canvas.dataset.model, (model) => {
		// if an object lies on its side or faces away, rotate it here, e.g.:
		// model.rotation.x = Math.PI / 2;
		const box = new THREE.Box3().setFromObject(model);
		size = box.getSize(new THREE.Vector3());
		model.position.sub(box.getCenter(new THREE.Vector3())); // center it on the pivot
		pivot.add(model);
		fit();
	});

	fit();

	return {
		fit,
		update() {
			pivot.rotation.y += (mouse.x * MAX_TURN - pivot.rotation.y) * EASE;
			pivot.rotation.x += (mouse.y * MAX_TURN - pivot.rotation.x) * EASE;
			renderer.render(scene, camera);
		}
	};
}

const items = [...document.querySelectorAll('.obj-link canvas')].map(setupObject);
window.addEventListener('resize', () => items.forEach((i) => i.fit()));

(function tick() {
	requestAnimationFrame(tick);
	items.forEach((i) => i.update());
})();
</script>
</body>

</html>
